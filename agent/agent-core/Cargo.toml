[package]

name = "agent"

version.workspace = true

edition = "2021"



[dependencies]


anureo-util = { path = "../../foundation/anureo-util" }

anureo-graph-core = { path = "../../foundation/graph-core" }

anureo-pregel = { path = "../../foundation/pregel" }

anureo-llm = { path = "../../foundation/llm" }





checkpoint = { path = "../../foundation/checkpoint" }
checkpoint-sqlite-store = { path = "../../foundation/checkpoint-sqlite-store" }
vector-store = { path = "../../experimental/vector-store" }

tool-core = { path = "../tool/tool-core" }

tool-basic = { path = "../tool/tool-basic" }

tool-extensions = { path = "../tool/tool-extensions" }

tool-experimental = { path = "../tool/tool-experimental" }

memory-v2 = { path = "../../experimental/memory-v2" }

skill = { path = "../skill" }


worktree = { path = "../../experimental/worktree" }



stream-event = { path = "../../foundation/stream-event" }

lsp = { path = "../../experimental/tool/lsp" }


chrono = "0.4"

async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"

serde_yaml = "0.9"

thiserror = "2.0"

tokio = { version = "1.0", features = ["full"] }

tokio-stream = "0.1"

tokio-util = { version = "0.7", features = ["rt"] }

tracing = "0.1"

dashmap = "6.0"

futures = "0.3"

futures-util = "0.3"

env-config = { path = "../../foundation/config", package = "config" }

model-spec-core = { path = "../../foundation/model-spec-core" }

async-openai = { version = "0.32", features = ["chat-completion", "embedding", "model"] }

task-core = { path = "../../experimental/task/task-core" }

lru = "0.12"

parking_lot = "0.12"

uuid = { version = "1", features = ["v4"] }



[dev-dependencies]

tempfile = "3"

checkpoint-sqlite-store = { path = "../../foundation/checkpoint-sqlite-store" }