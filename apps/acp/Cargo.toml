[package]
name = "anureo-acp"
version.workspace = true
edition.workspace = true
description = "ACP (Agent Client Protocol) server for anureo ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â run anureo as an ACP agent in IDEs"
license.workspace = true
authors.workspace = true

[lib]
name = "anureo_acp"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
agent = { path = "../../agent/agent-core" }
goal = { path = "../../agent/goal" }

anureo-graph-core = { path = "../../foundation/graph-core" }
anureo-llm = { path = "../../foundation/llm" }
checkpoint = { path = "../../foundation/checkpoint" }
checkpoint-sqlite-store = { path = "../../foundation/checkpoint-sqlite-store" }
tool-core = { path = "../../agent/tool/tool-core" }
tool-basic = { path = "../../agent/tool/tool-basic" }
tool-workflow = { path = "../../agent/tool/tool-workflow" }
model-spec-core = { path = "../../foundation/model-spec-core" }
stream-event = { path = "../../foundation/stream-event" }

anureo-curator = { path = "../../experimental/curator" }
config = { path = "../../foundation/config", features = ["tracing-init"] }
task-core = { path = "../../experimental/task/task-core" }
anureo-util = { path = "../../foundation/anureo-util" }
anureo-git = { path = "../../foundation/git" }
agent-client-protocol = { version = "0.15.1", features = ["unstable_boolean_config", "unstable_session_fork", "unstable_cancel_request", "unstable_model_config_category", "unstable_end_turn_token_usage"] }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tempfile = "3"
base64 = "0.22"
sha2 = "0.10"
ignore = "0.4"
tracing = "0.1"
rusqlite = "0.31"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { workspace = true }
uuid = { version = "1.23.0", features = ["v4"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
axum = { version = "0.7", features = ["ws"] }
serde_json = "1.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3"
tokio-util = { version = "0.7" }
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
env_logger = "0.10"
async-trait = { workspace = true }
serial_test = "3"
ctor = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ---- anureo-acp e2e test targets (plan 026) ---------------------------------
#
# `tests/e2e_mega.rs` is the single-case mega script. Cargo auto-discovers
# top-level `tests/*.rs`, so we declare it explicitly to keep naming
# deterministic (the file becomes the `e2e_mega` test binary).
#
# `tests/e2e/` is a directory ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â cargo does NOT auto-discover directories.
# We pin `tests/e2e/main.rs` as the crate root so `mod common;` inside it
# resolves `common/{env,harness,...}.rs` as submodules. Micro tests (M1ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“M5)
# land under `tests/e2e/*.rs` in Phase 3.

[[test]]
name = "e2e_mega"
path = "tests/e2e_mega.rs"

[[test]]
name = "e2e_session_list"
path = "tests/e2e_session_list.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
